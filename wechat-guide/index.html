<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="GenOffice 20 章功能专刊：逐章预览并一键复制到微信公众号编辑器。"
    />
    <meta name="theme-color" content="#efe9dc" />
    <title>GenOffice 功能专刊 · 20 章微信公众号内容中心</title>
    <style>
      :root {
        --paper: #f3eee3;
        --paper-deep: #e8dfcf;
        --ink: #171714;
        --muted: #706b61;
        --line: rgba(23, 23, 20, 0.14);
        --red: #b4382f;
        --red-dark: #7c211c;
        --moss: #3f5546;
        --white: #fffdf8;
        --shadow: 0 22px 70px rgba(55, 46, 32, 0.13);
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          linear-gradient(rgba(255, 255, 255, 0.35) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.35) 1px, transparent 1px), var(--paper);
        background-size: 34px 34px;
        font-family: 'Songti SC', 'Noto Serif CJK SC', 'STSong', Georgia, serif;
      }

      button,
      input,
      a {
        font: inherit;
      }

      button,
      a {
        -webkit-tap-highlight-color: transparent;
      }

      .app-shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(280px, 22vw) 1fr;
      }

      .rail {
        position: sticky;
        top: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background: #171714;
        color: #f8f1e4;
        border-right: 1px solid rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }

      .rail-head {
        padding: 26px 24px 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.13);
      }

      .brand {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .brand-mark {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        flex: 0 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.32);
        border-radius: 50%;
        font-size: 21px;
        font-weight: 700;
        color: #fff8e9;
      }

      .brand-copy {
        flex: 1;
      }

      .brand-copy strong {
        display: block;
        font-size: 16px;
        letter-spacing: 0.09em;
      }

      .brand-copy span {
        display: block;
        margin-top: 4px;
        color: rgba(255, 255, 255, 0.54);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .back-link {
        color: rgba(255, 255, 255, 0.72);
        text-decoration: none;
        font-size: 12px;
      }

      .back-link:hover {
        color: #fff;
      }

      .rail-intro {
        margin: 18px 0 0;
        color: rgba(255, 255, 255, 0.66);
        font-size: 12px;
        line-height: 1.8;
      }

      .search-wrap {
        position: relative;
        margin-top: 16px;
      }

      .search-wrap::before {
        content: '⌕';
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-53%);
        color: rgba(255, 255, 255, 0.48);
        font-size: 18px;
      }

      #search {
        width: 100%;
        height: 40px;
        padding: 0 12px 0 36px;
        color: #fff;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        border-radius: 5px;
        outline: none;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
      }

      #search:focus {
        border-color: rgba(255, 255, 255, 0.45);
        box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.06);
      }

      .chapter-list {
        flex: 1;
        padding: 10px 12px 24px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.24) transparent;
      }

      .chapter-item {
        display: grid;
        grid-template-columns: 34px 1fr 34px;
        align-items: center;
        gap: 8px;
        min-height: 54px;
        padding: 7px 7px 7px 4px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .chapter-item[hidden] {
        display: none;
      }

      .chapter-open,
      .chapter-copy {
        border: 0;
        color: inherit;
        background: transparent;
        cursor: pointer;
      }

      .chapter-open {
        display: contents;
      }

      .chapter-index {
        display: grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.58);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 10px;
      }

      .chapter-name {
        overflow: hidden;
        color: rgba(255, 255, 255, 0.72);
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
        line-height: 1.45;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chapter-copy {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        color: rgba(255, 255, 255, 0.45);
        font-size: 15px;
      }

      .chapter-copy:hover,
      .chapter-copy:focus-visible {
        color: #fff;
        background: rgba(255, 255, 255, 0.1);
        outline: none;
      }

      .chapter-item.active {
        background: rgba(255, 255, 255, 0.09);
      }

      .chapter-item.active .chapter-index {
        color: #fff;
        background: var(--red);
        border-color: var(--red);
      }

      .chapter-item.active .chapter-name {
        color: #fff;
      }

      .rail-foot {
        padding: 14px 20px 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.12);
      }

      .progress-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
        color: rgba(255, 255, 255, 0.54);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.08em;
      }

      .progress-track {
        height: 2px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.14);
      }

      #progressBar {
        width: 5%;
        height: 100%;
        background: #e1665d;
        transition: width 320ms ease;
      }

      .workspace {
        min-width: 0;
        padding: 24px clamp(22px, 5vw, 84px) 72px;
      }

      .topbar {
        max-width: 980px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
      }

      .edition {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 10px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .edition::before {
        content: '';
        width: 24px;
        height: 1px;
        background: var(--red);
      }

      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .tool-button {
        min-height: 40px;
        padding: 0 15px;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--ink);
        background: rgba(255, 253, 248, 0.58);
        cursor: pointer;
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
        transition:
          transform 160ms ease,
          background 160ms ease,
          color 160ms ease;
      }

      .tool-button:hover {
        transform: translateY(-1px);
        background: var(--white);
      }

      .tool-button.primary {
        color: #fff;
        background: var(--red);
        border-color: var(--red);
      }

      .tool-button.primary:hover {
        background: var(--red-dark);
      }

      .paper {
        position: relative;
        max-width: 980px;
        min-height: 760px;
        margin: 0 auto;
        padding: clamp(34px, 6vw, 78px) clamp(24px, 7vw, 92px) 62px;
        background: var(--white);
        border: 1px solid rgba(23, 23, 20, 0.12);
        box-shadow: var(--shadow);
        overflow: hidden;
      }

      .paper::before {
        content: '';
        position: absolute;
        inset: 14px;
        pointer-events: none;
        border: 1px solid rgba(180, 56, 47, 0.16);
      }

      .paper::after {
        content: 'GENOFFICE / FEATURE MONOGRAPH';
        position: absolute;
        right: -84px;
        top: 210px;
        transform: rotate(90deg);
        color: rgba(23, 23, 20, 0.16);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 9px;
        letter-spacing: 0.18em;
      }

      .article-stage {
        position: relative;
        z-index: 1;
        animation: reveal 420ms ease both;
      }

      @keyframes reveal {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .page-controls {
        max-width: 980px;
        margin: 18px auto 0;
        display: flex;
        justify-content: space-between;
        gap: 12px;
      }

      .page-button {
        width: min(48%, 300px);
        min-height: 58px;
        padding: 10px 15px;
        border: 1px solid var(--line);
        border-radius: 4px;
        color: var(--ink);
        background: rgba(255, 253, 248, 0.48);
        cursor: pointer;
        text-align: left;
      }

      .page-button:last-child {
        text-align: right;
      }

      .page-button span {
        display: block;
        margin-bottom: 4px;
        color: var(--muted);
        font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace;
        font-size: 9px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .page-button strong {
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
        font-weight: 500;
      }

      .page-button:disabled {
        visibility: hidden;
      }

      .toast {
        position: fixed;
        right: 26px;
        bottom: 26px;
        z-index: 20;
        max-width: min(420px, calc(100vw - 40px));
        padding: 14px 18px;
        color: #fff;
        background: #171714;
        border-left: 4px solid #e1665d;
        box-shadow: 0 16px 44px rgba(0, 0, 0, 0.22);
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 13px;
        line-height: 1.6;
        opacity: 0;
        transform: translateY(12px);
        pointer-events: none;
        transition: 220ms ease;
      }

      .toast.show {
        opacity: 1;
        transform: translateY(0);
      }

      .empty-search {
        padding: 40px 18px;
        color: rgba(255, 255, 255, 0.52);
        font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
        font-size: 12px;
        line-height: 1.8;
        text-align: center;
      }

      @media (max-width: 900px) {
        .app-shell {
          display: block;
        }

        .rail {
          position: relative;
          height: auto;
        }

        .rail-head {
          padding-bottom: 14px;
        }

        .rail-intro,
        .rail-foot {
          display: none;
        }

        .chapter-list {
          display: flex;
          gap: 7px;
          padding: 8px 14px 14px;
          overflow-x: auto;
        }

        .chapter-item {
          flex: 0 0 auto;
          display: flex;
          min-height: 38px;
          padding: 4px 8px;
          border: 1px solid rgba(255, 255, 255, 0.12);
          border-radius: 3px;
        }

        .chapter-name,
        .chapter-copy {
          display: none;
        }

        .workspace {
          padding: 18px 13px 44px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .toolbar {
          width: 100%;
        }

        .tool-button {
          flex: 1;
          padding: 0 8px;
        }

        .paper {
          padding: 42px 22px 46px;
        }

        .paper::after {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="rail" aria-label="20 章目录">
        <div class="rail-head">
          <div class="brand">
            <div class="brand-mark" aria-hidden="true">G</div>
            <div class="brand-copy">
              <strong>GenOffice 功能专刊</strong>
              <span>20 chapters · WeChat ready</span>
            </div>
            <a class="back-link" href="../docs/index.html" aria-label="返回本地 GenOffice 首页"
              >返回 ↗</a
            >
          </div>
          <p class="rail-intro">
            每章都是一篇独立、完整的公众号文章。选择章节预览，点击复制即可粘贴到微信公众号编辑器。
          </p>
          <div class="search-wrap">
            <input
              id="search"
              type="search"
              placeholder="搜索功能、场景或关键词"
              autocomplete="off"
            />
          </div>
        </div>
        <nav id="chapterList" class="chapter-list"></nav>
        <div class="rail-foot">
          <div class="progress-row">
            <span>READING PROGRESS</span><span id="progressText">01 / 20</span>
          </div>
          <div class="progress-track"><div id="progressBar"></div></div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="edition">GenOffice Feature Monograph · v0.6.64</div>
          <div class="toolbar" aria-label="文章操作">
            <button id="copyPlain" class="tool-button" type="button">复制纯文本</button>
            <button id="copyRich" class="tool-button primary" type="button">
              复制本章到公众号
            </button>
          </div>
        </header>

        <section class="paper" aria-live="polite">
          <article id="articleStage" class="article-stage"></article>
        </section>

        <nav class="page-controls" aria-label="章节翻页">
          <button id="prevChapter" class="page-button" type="button"></button>
          <button id="nextChapter" class="page-button" type="button"></button>
        </nav>
      </main>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script>
      const chapters = [
        {
          title: '为什么 GenOffice 不是普通 AI 套壳',

            {

            },
          ],
          takeaway:

          title: 'Local-First 与 ZenMux：数据主权如何落地',

                '工程与标准：标准组织和项目官方文档',
                '保留来源链接与检索日期',
              ],
            },
            {
              title: '网络限制提示',
              paragraphs: [
                'AI、学术检索、图片生成和联网核查都可能受到网络、代理、模型繁忙或供应商超时影响。应用会提示用户检查网络或重试；对长任务，建议拆成“大纲—分段生成—统一校验”三步。',
              ],
            },
          ],
          takeaway: '事实核查的最低标准是：来源可访问、时间可说明、结论能回到原始证据。',
        },
        {
          title: '四个 3 分钟工作流：把能力连成闭环',
          eyebrow: 'CHAPTER 20 · PRACTICAL COOKBOOK',
          summary: '用四个真实场景结束功能专刊：公式、文献、数据和跨文档协作。',
          quote: '工具的价值不在功能清单，而在能否把一个任务从输入带到交付。',
          sections: [
            {
              title: '场景 A：公式截图进入论文',
              paragraphs: [
                '把公式截图粘贴到 Word 公式识别入口，确认 LaTeX 后插入 OMML；再用 AI 检查符号定义是否与上下文一致。',
              ],
              bullets: ['裁剪公式主体', '识别并人工校对', '插入可编辑公式', '保存后重新打开验证'],
            },
            {
              title: '场景 B：文献检索与引用',
              paragraphs: [
                '用标题或 DOI 检索真实元数据，加入本地文献库；输入 /cite 选择条目，自动维护文末参考文献并导出 BibTeX。',
              ],
            },
            {
              title: '场景 C：Excel 到 PPT',
              paragraphs: [
                '在 Excel 中选择字段完成 EDA 与图表，使用 SQL 进行多表 JOIN，把结论通过 @Connect 发送到 PPT，再调整为可编辑的演示对象。',
              ],
            },
            {
              title: '场景 D：PDF 审阅到 Word 报告',
              paragraphs: [
                '在 PDF 中跨页框选关键方法与图表，启动严格审稿委员会；复制完整报告或通过 @Connect 送到 Word，形成可继续修改的正式评审文档。',
              ],
            },
          ],
          takeaway: 'GenOffice 的最终目标，是让文档、数据、证据与 AI 结果在用户控制下顺畅流动。',
        },
      ]

      const state = { current: 0, query: '' }
      const list = document.getElementById('chapterList')
      const stage = document.getElementById('articleStage')
      const search = document.getElementById('search')
      const toast = document.getElementById('toast')
      const progressText = document.getElementById('progressText')
      const progressBar = document.getElementById('progressBar')
      const prevButton = document.getElementById('prevChapter')
      const nextButton = document.getElementById('nextChapter')

      function escapeHtml(value) {
        return String(value)
          .replaceAll('&', '&amp;')
          .replaceAll('<', '&lt;')
          .replaceAll('>', '&gt;')
          .replaceAll('"', '&quot;')
          .replaceAll("'", '&#039;')
      }

      function chapterNumber(index) {
        return String(index + 1).padStart(2, '0')
      }

      function buildSection(section) {
        const paragraphs = (section.paragraphs || [])
          .map(
            (text) =>
              `<p style="margin:0 0 15px;color:#35342f;font-size:16px;line-height:1.95;letter-spacing:.02em;text-align:justify;">${escapeHtml(text)}</p>`,
          )
          .join('')
        const bullets = section.bullets?.length
          ? `<ul style="margin:20px 0 24px;padding:18px 20px 10px 42px;background:#f5f1e8;border-left:4px solid #3f5546;border-radius:2px;">${section.bullets
              .map(
                (item) =>
                  `<li style="margin:0 0 10px;color:#35342f;font-size:15px;line-height:1.75;">${escapeHtml(item)}</li>`,
              )
              .join('')}</ul>`
          : ''
        return `<section style="margin:0 0 34px;">
          <h2 style="margin:0 0 16px;padding:0 0 10px;border-bottom:1px solid #d8d0c1;color:#171714;font-size:21px;line-height:1.45;font-weight:700;">${escapeHtml(section.title)}</h2>
          ${paragraphs}${bullets}
        </section>`
      }

      function buildWechatChapter(chapter, index) {
        return `<section data-wechat-article="true" style="max-width:677px;margin:0 auto;padding:8px 4px 24px;background:#fffdf8;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
          <p style="margin:0 0 20px;color:#b4382f;font-size:11px;line-height:1.5;letter-spacing:.12em;text-align:center;">${escapeHtml(chapter.eyebrow)}</p>
          <h1 style="margin:0;color:#171714;font-family:'Songti SC','STSong',serif;font-size:34px;line-height:1.35;font-weight:700;letter-spacing:.02em;text-align:center;">${escapeHtml(chapter.title)}</h1>
          <p style="margin:18px auto 0;max-width:570px;color:#706b61;font-size:15px;line-height:1.85;text-align:center;">${escapeHtml(chapter.summary)}</p>
          <div style="width:48px;height:3px;margin:24px auto 30px;background:#b4382f;"></div>
          <blockquote style="margin:0 0 34px;padding:22px 24px;background:#171714;border:0;color:#fffdf8;font-family:'Songti SC','STSong',serif;font-size:19px;line-height:1.75;text-align:center;">${escapeHtml(chapter.quote)}</blockquote>
          ${chapter.sections.map(buildSection).join('')}
          <section style="margin:38px 0 10px;padding:22px 24px;border:1px solid #b4382f;background:#fff8ef;">
            <p style="margin:0 0 8px;color:#b4382f;font-size:11px;line-height:1.5;letter-spacing:.12em;font-weight:700;">本章要点 · TAKEAWAY</p>
            <p style="margin:0;color:#171714;font-family:'Songti SC','STSong',serif;font-size:18px;line-height:1.8;font-weight:700;">${escapeHtml(chapter.takeaway)}</p>
          </section>
          <p style="margin:28px 0 0;color:#9a9387;font-size:10px;line-height:1.6;letter-spacing:.08em;text-align:center;">GenOffice 功能专刊 · 第 ${chapterNumber(index)} / 20 章 · Apache-2.0 开源项目</p>
        </section>`
      }

      function buildList() {
        list.innerHTML = chapters
          .map(
            (
              chapter,
              index,
            ) => `<div class="chapter-item${index === state.current ? ' active' : ''}" data-index="${index}" data-search="${escapeHtml(
              `${chapter.title} ${chapter.summary} ${chapter.sections.map((section) => section.title).join(' ')}`.toLowerCase(),
            )}">
              <button class="chapter-open" type="button" aria-label="打开第 ${chapterNumber(index)} 章 ${escapeHtml(chapter.title)}">
                <span class="chapter-index">${chapterNumber(index)}</span>
                <span class="chapter-name">${escapeHtml(chapter.title)}</span>
              </button>
              <button class="chapter-copy" type="button" title="复制本章到公众号" aria-label="复制第 ${chapterNumber(index)} 章到公众号">⧉</button>
            </div>`,
          )
          .join('')

        list.querySelectorAll('.chapter-item').forEach((item) => {
          const index = Number(item.dataset.index)
          item.querySelector('.chapter-open').addEventListener('click', () => showChapter(index))
          item.querySelector('.chapter-copy').addEventListener('click', (event) => {
            event.stopPropagation()
            copyChapter(index, true)
          })
        })
        applySearch()
      }

      function showChapter(index) {
        state.current = Math.max(0, Math.min(chapters.length - 1, index))
        stage.style.animation = 'none'
        stage.offsetHeight
        stage.style.animation = ''
        stage.innerHTML = buildWechatChapter(chapters[state.current], state.current)
        document.querySelectorAll('.chapter-item').forEach((item) => {
          item.classList.toggle('active', Number(item.dataset.index) === state.current)
        })
        const activeItem = list.querySelector(`[data-index="${state.current}"]`)
        activeItem?.scrollIntoView({ block: 'nearest', inline: 'nearest' })
        progressText.textContent = `${chapterNumber(state.current)} / 20`
        progressBar.style.width = `${((state.current + 1) / chapters.length) * 100}%`
        updatePager()
        document.title = `${chapterNumber(state.current)} · ${chapters[state.current].title} | GenOffice 功能专刊`
        if (window.innerWidth < 900)
          document.querySelector('.workspace').scrollIntoView({ behavior: 'smooth' })
      }

      function updatePager() {
        const prev = chapters[state.current - 1]
        const next = chapters[state.current + 1]
        prevButton.disabled = !prev
        nextButton.disabled = !next
        prevButton.innerHTML = prev
          ? `<span>← Previous · ${chapterNumber(state.current - 1)}</span><strong>${escapeHtml(prev.title)}</strong>`
          : ''
        nextButton.innerHTML = next
          ? `<span>Next · ${chapterNumber(state.current + 1)} →</span><strong>${escapeHtml(next.title)}</strong>`
          : ''
      }

      function applySearch() {
        const query = state.query.trim().toLowerCase()
        let visible = 0
        list.querySelectorAll('.chapter-item').forEach((item) => {
          const match = !query || item.dataset.search.includes(query)
          item.hidden = !match
          if (match) visible += 1
        })
        list.querySelector('.empty-search')?.remove()
        if (!visible) {
          list.insertAdjacentHTML(
            'beforeend',
            '<div class="empty-search">没有找到相关章节。<br />试试“公式”“PDF”或“审稿”。</div>',
          )
        }
      }

      function plainTextFor(index) {
        const holder = document.createElement('div')
        holder.innerHTML = buildWechatChapter(chapters[index], index)
        return holder.innerText
      }

      async function writeRichClipboard(html, plain) {
        if (navigator.clipboard && window.ClipboardItem) {
          await navigator.clipboard.write([
            new ClipboardItem({
              'text/html': new Blob([html], { type: 'text/html' }),
              'text/plain': new Blob([plain], { type: 'text/plain' }),
            }),
          ])
          return
        }

        const sandbox = document.createElement('div')
        sandbox.contentEditable = 'true'
        sandbox.style.cssText = 'position:fixed;left:-99999px;top:0;opacity:0;pointer-events:none;'
        sandbox.innerHTML = html
        document.body.appendChild(sandbox)
        const selection = window.getSelection()
        const range = document.createRange()
        range.selectNodeContents(sandbox)
        selection.removeAllRanges()
        selection.addRange(range)
        const copied = document.execCommand('copy')
        selection.removeAllRanges()
        sandbox.remove()
        if (!copied) throw new Error('copy command failed')
      }

      async function copyChapter(index, rich) {
        const chapter = chapters[index]
        const html = buildWechatChapter(chapter, index)
        const plain = plainTextFor(index)
        try {
          if (rich) {
            await writeRichClipboard(html, plain)
            showToast(`第 ${chapterNumber(index)} 章已按公众号富文本格式复制`)
          } else {
            await navigator.clipboard.writeText(plain)
            showToast(`第 ${chapterNumber(index)} 章纯文本已复制`)
          }
        } catch (error) {
          try {
            const textarea = document.createElement('textarea')
            textarea.value = plain
            textarea.style.cssText = 'position:fixed;left:-99999px;top:0;'
            document.body.appendChild(textarea)
            textarea.select()
            const copied = document.execCommand('copy')
            textarea.remove()
            if (!copied) throw error
            showToast('浏览器限制了富文本剪贴板，已复制纯文本版本')
          } catch {
            showToast('复制失败，请允许浏览器使用剪贴板后重试')
          }
        }
      }

      let toastTimer
      function showToast(message) {
        toast.textContent = message
        toast.classList.add('show')
        window.clearTimeout(toastTimer)
        toastTimer = window.setTimeout(() => toast.classList.remove('show'), 2600)
      }

      search.addEventListener('input', () => {
        state.query = search.value
        applySearch()
      })
      document
        .getElementById('copyRich')
        .addEventListener('click', () => copyChapter(state.current, true))
      document
        .getElementById('copyPlain')
        .addEventListener('click', () => copyChapter(state.current, false))
      prevButton.addEventListener('click', () => showChapter(state.current - 1))
      nextButton.addEventListener('click', () => showChapter(state.current + 1))
      document.addEventListener('keydown', (event) => {
        if (event.target.matches('input, textarea')) return
        if (event.key === 'ArrowLeft' && state.current > 0) showChapter(state.current - 1)
        if (event.key === 'ArrowRight' && state.current < chapters.length - 1)
          showChapter(state.current + 1)
      })

      buildList()
      showChapter(0)
    </script>
  </body>
</html>
